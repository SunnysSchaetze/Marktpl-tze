<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marktplätze</title>

<style>
html {
    background-color: #ff7f00; /* Außenfarbe */
    padding: 10px;
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: calc(100vh - 20px);
    display: flex;
    justify-content: center;
    align-items: center;
    background-color: #000000; /* Schwarzer Container */
    font-family: Arial, sans-serif;
    color: orange;

    border-radius: 25px; /* Abgerundete Ecken */
    overflow: hidden;
}

.marktplatz {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 15px;
    font-size: clamp(1.2rem, 2vw, 2rem);
    text-align: center;
    padding: 20px;
}

.marktplatz span {
    font-weight: bold;
}

.marktplatz a {
    display: flex;
    align-items: center;
    text-decoration: none;
}

.marktplatz img {
    width: clamp(2rem, 4vw, 2.5rem);
    height: clamp(2rem, 4vw, 2.5rem);
    transition: transform 0.3s ease, filter 0.3s ease;
}

.marktplatz a:hover img {
    transform: scale(1.2);
    filter: brightness(1.5) drop-shadow(0 0 5px orange);
}

@media (max-width: 600px) {
    .marktplatz {
        gap: 10px;
        font-size: 1rem;
    }
}
</style>
</head>

<body>

<div class="marktplatz">
    <span>Marktplätze:</span>

    <a href="https://www.ebay.de/usr/sunnysschatz" target="_blank" aria-label="eBay Shop">
        <img src="https://cdn-icons-png.flaticon.com/512/14083/14083029.png" alt="eBay">
    </a>

    <a href="https://www.kleinanzeigen.de/s-bestandsliste.html?userId=156248118" target="_blank" aria-label="Kleinanzeigen">
        <img src="https://themen.kleinanzeigen.de/media/files/27/3b/273bc204-1648-4354-9bb7-139156345e74/ka_vertical_lightgreen_rgb.png?utm_source=google&utm_medium=organic&utm_campaign=themen" alt="Kleinanzeigen">
    </a>

    <a href="https://wa.me/c/4917638265657" target="_blank" aria-label="WhatsApp Katalog">
        <img src="https://cdn-icons-png.flaticon.com/512/15713/15713434.png" alt="WhatsApp Katalog">
    </a>
</div>

</body>
</html>
